{% extends "_admin_base.html" %}


{% block content %}

{% if auth_failed %}
<!-- Unauthorized UI -->
<div class="text-center p-5">
    <h4>Unauthorized. Please log in as Admin.</h4>
</div>

{% else %}
<!-- Filters -->
<form id="filterForm">
    <div class="container-filter ">
        <div class="half">
            <div class="card card-blue-shadow">
                <div class="card-txtfield card-body ">
                    <label for="status">Status: </label>
                    <select name="status" class="form-select">
                        <option value="">All</option>
                        <option value="1">Active</option>
                        <option value="0">Inactive</option>
                    </select>

                    <label for="min_expense">Normal Class Fee: </label>
                    <div class="uk-flex uk-flex-between uk-flex-middle uk-width-1-1">
                        <div class="uk-width-expand">
                            <input type="number" name="normal_class_fee_min" step="0.01"
                                placeholder="Start amount for filter normal class fee range" class="uk-width-1-1"
                                uk_tooltip="title: Start amount for filter normal class fee range; pos: top-left;">
                        </div>
                        <div class="uk-margin-small-left uk-margin-small-right uk-flex uk-flex-middle">
                            -
                        </div>
                        <div class="uk-width-expand">
                            <input type="number" name="normal_class_fee_max" step="0.01"
                                placeholder="End amount for filter normal class fee range" class="uk-width-1-1"
                                uk_tooltip="title: End amount for filter normal class fee range; pos: top-left;">
                        </div>
                    </div>

                    <label for="focus_class_fee">Focus Class Fee: </label>
                    <div class="uk-flex uk-flex-between uk-flex-middle uk-width-1-1">
                        <div class="uk-width-expand">
                            <input type="number" name="focus_class_fee_min" step="0.01"
                                placeholder="Start amount for filter focus class fee range" class="uk-width-1-1"
                                uk_tooltip="title: Start amount for filter focus class fee range; pos: top-left;">
                        </div>
                        <div class="uk-margin-small-left uk-margin-small-right uk-flex uk-flex-middle">
                            -
                        </div>
                        <div class="uk-width-expand">
                            <input type="number" name="focus_class_fee_max" step="0.01"
                                placeholder="End amount for filter focus class fee range" class="uk-width-1-1"
                                uk_tooltip="title: End amount for filter focus class fee range; pos: top-left;">
                        </div>
                    </div>

                    <label for="material_fee">Material Fee: </label>
                    <div class="uk-flex uk-flex-between uk-flex-middle uk-width-1-1">
                        <div class="uk-width-expand">
                            <input type="number" name="material_fee_min" step="0.01"
                                placeholder="Start amount for filter material fee range" class="uk-width-1-1"
                                uk_tooltip="title: Start amount for filter material fee range; pos: top-left;">
                        </div>
                        <div class="uk-margin-small-left uk-margin-small-right uk-flex uk-flex-middle">
                            -
                        </div>
                        <div class="uk-width-expand">
                            <input type="number" name="material_fee_max" step="0.01"
                                placeholder="End amount for filter material fee range" class="uk-width-1-1"
                                uk_tooltip="title: End amount for filter material fee range; pos: top-left;">
                        </div>
                    </div>

                    <label for="filter_pageitems">Item Per Page: </label>
                    <select name="per_page" id="per_page" class="form-select">
                        <option value="7" {% if per_page==7 %}selected{% endif %}>7</option>
                        <option value="10" {% if per_page==10 %}selected{% endif %}>10</option>
                        <option value="20" {% if per_page==20 %}selected{% endif %}>20</option>
                    </select>

                </div>
            </div>

        </div>
    </div>

    <div class="card-button-right">
        <button data-get="/subject/import" id="b_create">Import Subject</button>
        <button data-get="/subject/add" id="b_create">Create New Subject</button>
    </div>
    

    <div class="search-container card-right-tb">
        <div class="search-bar">
            <input type="search" name="name" placeholder="Search Subject Name..." id="search" class="search-input">
            <button id="search-button" type="button"><i class="fas fa-search"></i></button>
        </div>
    </div>
</form>

<!-- Subject Table -->
<div id="subjectTable">
    {% include '/admin/subject/_subject_list.html' %}
</div>
{% endif %}
{% endblock %}




{% block scripts %}
<script>
    let currentSort = '{{ sort or "subject_id" }}';
    let currentDir = '{{ dir or "asc" }}';
    let currentPage = 1;

    function loadTable(params = {}) {
        if (currentSort) {
            params.sort = currentSort;
            params.dir = currentDir;
        }

        params.page = currentPage;

        $.get("/subject/list", params, function (data) {
            // If no subjects found, reset page to 1 and re-fetch
            if ($(data).find('tbody tr').length === 1 && $(data).find('tbody td').text().includes('No subjects found')) {
                currentPage = 1;
                params.page = 1;
                $.get("/subject/list", params, function (newData) {
                    $('#subjectTable').html(newData);
                    bindStatusButtonEvents();
                });
            } else {
                $('#subjectTable').html(data);
                bindStatusButtonEvents();
            }
        });
    }


    function bindStatusButtonEvents() {
        $('.status-btn').off('click').on('click', function () {
            const btn = $(this);
            const id = btn.data('id');
            const action = btn.data('action');
            const formattedId = `SJ${id.toString().padStart(4, '0')}`;
            var msg = "";

            if (action === "deactivate") {
                msg = "<small>⚠️ <strong>Note: </strong>All the <u>class and class session</u> under this subject will also be deactivated and <u>cannot be reactivated back</u>.</small>";
            } else {
                msg = "<small>⚠️ <strong>Note: </strong>All the <u>class and class session</u> under this subject will <u>not be reactivated back</u>. You will need to reschedule again.</small>";
            }

            showWarningAlert('Please Confirm', `Are you sure you want to ${action} Subject ${formattedId}? <br /><br /> ${msg}`).then(confirmed => {
                if (!confirmed) return;

                $.post(`/subject/${action}/${id}`, function (res) {
                    if (res.success) {
                        const newAction = action === 'deactivate' ? 'activate' : 'deactivate';
                        btn.text(newAction.charAt(0).toUpperCase() + newAction.slice(1));
                        btn.data('action', newAction);
                        btn.toggleClass('btn-activate btn-deactivate');
                        showActionSuccessAlert('Success', `Subject ${formattedId} has been ${action}d.`);
                    } else {
                        showErrorAlert('Error', `Subject ${formattedId} not found.`);
                    }
                });
            });
        });
    }

    $(function () {
        bindStatusButtonEvents();

        // Any filter input change (including per_page)
        $('#filterForm input, #filterForm select').on('input change', function () {
            const formData = $('#filterForm').serializeArray();
            const params = {};
            formData.forEach(item => params[item.name] = item.value);

            // Do NOT reset page — keep currentPage
            loadTable(params);
        });

        // Pagination click
        $(document).on('click', '.pagination a', function (e) {
            e.preventDefault();
            const page = new URL(this.href).searchParams.get('page');
            currentPage = parseInt(page) || 1;

            const formData = $('#filterForm').serializeArray();
            const params = {};
            formData.forEach(item => params[item.name] = item.value);
            loadTable(params);
        });

        // Sort link click
        $(document).on('click', '.sort-link', function (e) {
            e.preventDefault();
            const sort = $(this).data('sort');
            if (currentSort === sort) {
                currentDir = currentDir === 'asc' ? 'desc' : 'asc';
            } else {
                currentSort = sort;
                currentDir = 'asc';
            }

            const formData = $('#filterForm').serializeArray();
            const params = {};
            formData.forEach(item => params[item.name] = item.value);
            loadTable(params);
        });

        $('#search').on('input', function () {
            const formData = $('#filterForm').serializeArray();
            const params = {};
            formData.forEach(item => params[item.name] = item.value);
            loadTable(params);
        });


    });
</script>
{% endblock %}
