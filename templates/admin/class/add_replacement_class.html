{% extends "_admin_base.html" %}

{% block head %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="{{ url_for('static', filename='js/general/class/class_replacement.js') }}"></script>
{% endblock %}

{% block content %}
<form method="post" id="replacement-form" data-mode="add">
    <div class="container">
        <div class="columns">
            <div class="formformat column col-6 col-sm-12 card my-single-card">
                <div class="card-header">
                    <div class="card-title h5">
                        <button class="topleft-back" type="button" data-get="/class/session/list"
                            uk-tooltip="title: Back to Previous Section; pos: top-left;">
                            <i class="fa-solid fa-arrow-left"></i>
                        </button> &nbsp; Add Replacement Class
                    </div>
                </div>

                <div class="card-body my-pagecard-body">

                    <!-- Education Level -->
                    <div class="form-group">
                        <label for="edu_lvl_id">Education Level:</label>
                        <select class="form-select select2" id="edu_lvl_id" name="edu_lvl_id">
                            <option value="" disabled selected>Select Education Level</option>
                            {% for edu_lvl in edu_lvls %}
                            <option value="{{ edu_lvl['edu_lvl_id'] }}">{{ edu_lvl['name'] }}</option>
                            {% endfor %}
                        </select>
                        <span class="error-message"></span>
                    </div>

                    <!-- Subject -->
                    <div class="form-group">
                        <label for="subject_id">Subject:</label>
                        <select class="form-select select2" id="subject_id" name="subject_id" disabled>
                            <option value="" disabled selected>Select Subject</option>
                        </select>
                        <span class="error-message"></span>
                    </div>

                    <!-- Class Session -->
                    <div class="form-group">
                        <label for="time_schedule_key">Class Session To Replace:</label>
                        <select class="form-select select2" id="time_schedule_key" name="time_schedule_key" disabled>
                            <option value="" disabled selected>Select Class To For Replacement</option>
                        </select>
                        <span class="error-message"></span>
                    </div>

                    <div class="uk-grid">
                        <div class="uk-width-1-2">
                            <!-- Replacement Date & Time -->
                            <div class="form-group">
                                <label for="replacement_datetime">Replacement Start Date & Time:</label>
                                <input type="text" id="replacement_datetime" name="replacement_datetime"
                                    class="form-input" placeholder="Select start date & time" />
                                <span class="error-message"></span>
                            </div>
                        </div>

                        <div class="uk-width-expand" style="padding-left: 20px;">
                            <!-- Calculated End Time -->
                            <div class="form-group">
                                <label for="replacement_end_datetime">End Date & Time:</label>
                                <input type="text" id="replacement_end_datetime" name="replacement_end_datetime"
                                    class="form-input" readonly />
                            </div>
                        </div>
                    </div>

                    <input type="hidden" name="replacement_start_iso" id="replacement_start_iso">
                    <input type="hidden" name="replacement_end_iso" id="replacement_end_iso">


                    <div class="text-right" style="padding-top:16px;">
                        <button type="reset" class="btn btn-secondary">Reset</button>
                        <button type="submit" class="btn btn-primary">Add</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</form>
{% endblock %}
