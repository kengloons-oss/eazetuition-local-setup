{% extends "_admin_base.html" %}
{% block content %}
<!-- Filters -->
<form id="filterForm">
    <div class="container-filter ">
        <div class="half">
            <div class="card card-blue-shadow">
                <div class="card-txtfield card-body ">
                    <label for="status">Status: </label>
                    <select name="status" class="form-select">
                        <option value="">All</option>
                        <option value="1" selected>Active</option>
                        <option value="0">Inactive</option>
                    </select>

                    <label for="class_type">Class Type: </label>
                    <select name="class_type" class="form-select">
                        <option value="">All</option>
                        <option value="N">Normal</option>
                        <option value="F">Focus</option>
                    </select>

                    <label for="time_per_week">Time Per Week: </label>
                    <div class="uk-flex uk-flex-between uk-flex-middle uk-width-1-1">
                        <div class="uk-width-expand">
                            <input type="number" name="time_per_week_min" step="1" min="1" max="9999"
                                placeholder="Start amount for filter time per week range" class="uk-width-1-1"
                                uk_tooltip="title: Start amount for filter time per week range; pos: top-left;">
                        </div>
                        <div class="uk-margin-small-left uk-margin-small-right uk-flex uk-flex-middle">
                            -
                        </div>
                        <div class="uk-width-expand">
                            <input type="number" name="time_per_week_max" step="1" min="1" max="9999"
                                placeholder="End amount for filter time per week range" class="uk-width-1-1"
                                uk_tooltip="title: End amount for filter time per week range; pos: top-left;">
                        </div>
                    </div>

                    <label for="filter_pageitems">Item Per Page: </label>
                    <select name="per_page" id="per_page" class="form-select">
                        <option value="7" {% if per_page==7 %}selected{% endif %}>7</option>
                        <option value="10" {% if per_page==10 %}selected{% endif %}>10</option>
                        <option value="20" {% if per_page==20 %}selected{% endif %}>20</option>
                    </select>

                </div>
            </div>

        </div>
    </div>

    <div class="card-button-right">
        <button data-get="/class/add" id="b_create">Create New Class</button>
    </div>

    <div class="search-container card-right-tb">
        <div class="search-bar">
            <input type="search" name="search_subject_name" placeholder="Search Subject Name..." id="search"
                class="search-input">
            <button id="search-button" type="button"><i class="fas fa-search"></i></button>
        </div>
        <div class="search-bar">
            <input type="search" name="search_tutor_name" placeholder="Search Tutor Name..." id="search"
                class="search-input">
            <button id="search-button" type="button"><i class="fas fa-search"></i></button>
        </div>
    </div>
</form>

<!-- Class Table -->
<div id="classTable">
    {% include '/admin/class/_class_list.html' %}
</div>
{% endblock %}

{% block scripts %}
<script>
    let currentSort = '{{ sort or "class_id" }}';
    let currentDir = '{{ dir or "asc" }}';
    let currentPage = 1;

    function loadTable(params = {}) {
        if (currentSort) {
            params.sort = currentSort;
            params.dir = currentDir;
        }

        params.page = currentPage;

        $.get("/class/list", params, function (data) {
            // If no class found, reset page to 1 and re-fetch
            if ($(data).find('tbody tr').length === 1 && $(data).find('tbody td').text().includes('No class found')) {
                currentPage = 1;
                params.page = 1;
                $.get("/class/list", params, function (newData) {
                    $('#classTable').html(newData);
                    bindStatusButtonEvents();
                });
            } else {
                $('#classTable').html(data);
                bindStatusButtonEvents();
            }
        });
    }


    function bindStatusButtonEvents() {
        $('.status-btn').off('click').on('click', function () {
            const btn = $(this);
            const id = btn.data('id');
            const action = "deactivate";
            const formattedId = `CL${id.toString().padStart(4, '0')}`;

            showWarningAlert('Please Confirm', `Are you sure you want to ${action} <strong>Class ${formattedId}</strong>?<br/><br/>
                            <small>
                                ⚠️ <strong>Note:</strong> Any schedules linked to this class will also be 
                                <strong>automatically deactivated</strong> and <u>cannot be reactivated once this action is confirmed</u>.
                            </small>`).then(confirmed => {
                if (!confirmed) return;

                $.post(`/class/${action}/${id}`, function (res) {
                    if (res.success) {
                        btn.fadeOut(300, function () {
                            $(this).remove(); // Optional: remove it entirely after fade-out
                        });
                        showActionSuccessAlert('Success', `Class ${formattedId} has been ${action}d.`);
                    } else {
                        showErrorAlert('Error', `Class ${formattedId} not found.`);
                    }
                });
            });
        });
    }

    $(function () {
        bindStatusButtonEvents();

        // Default filter: show only active classes
        $('select[name="status"]').val('1');
        const defaultParams = { status: '1' };
        loadTable(defaultParams);

        // Any filter input change (including per_page)
        $('#filterForm input, #filterForm select').on('input change', function () {
            const formData = $('#filterForm').serializeArray();
            const params = {};
            formData.forEach(item => params[item.name] = item.value);

            // Do NOT reset page — keep currentPage
            loadTable(params);
        });

        // Pagination click
        $(document).on('click', '.pagination a', function (e) {
            e.preventDefault();
            const page = new URL(this.href).searchParams.get('page');
            currentPage = parseInt(page) || 1;

            const formData = $('#filterForm').serializeArray();
            const params = {};
            formData.forEach(item => params[item.name] = item.value);
            loadTable(params);
        });

        // Sort link click
        $(document).on('click', '.sort-link', function (e) {
            e.preventDefault();
            const sort = $(this).data('sort');
            if (currentSort === sort) {
                currentDir = currentDir === 'asc' ? 'desc' : 'asc';
            } else {
                currentSort = sort;
                currentDir = 'asc';
            }

            const formData = $('#filterForm').serializeArray();
            const params = {};
            formData.forEach(item => params[item.name] = item.value);
            loadTable(params);
        });

        $('#search').on('input', function () {
            const formData = $('#filterForm').serializeArray();
            const params = {};
            formData.forEach(item => params[item.name] = item.value);
            loadTable(params);
        });

    });
</script>
{% endblock %}
