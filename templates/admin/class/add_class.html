{% extends "_admin_base.html" %}

{% block head %}
<!-- Include Flatpickr CSS and JS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="{{ url_for('static', filename='js/general/class/class_helper.js') }}"></script>
<script src="{{ url_for('static', filename='js/general/class/class_validation.js') }}"></script>

{% endblock %}

{% block content %}
<form method="post" action="" id="class-form" data-mode="add">
    <div class="container card my-pagecard">
        <div class="columns">
            <!-- con2 -->
            <!-- left-side -->
            <div class="formformat column col-6 col-sm-12">
                <div class="card-header">
                    <div class="card-title h5">
                        <!-- Back Button -->
                        <button class="topleft-back" type="button" data-get="/class/list"
                            uk-tooltip="title: Back to Previous Section; pos: top-left;"><i
                                class="fa-solid fa-arrow-left"></i></button> &nbsp;
                        <!-- Page Title -->
                        Add Class
                    </div>
                </div>

                <div class="card-body my-pagecard-body">

                    <!-- Subject -->
                    <div class="form-group">
                        <label class="form-label" for="subject_id">Subject: </label>
                        <select class="form-select select2 subject_id" name="subject_id">
                            <option value="" disabled selected>Select Subject</option>
                            {% for subject in subjects %}
                            <option value="{{ subject['subject_id'] }}">{{ subject['name'] }} ({{ subject['education_level']['name'] }})</option>
                            {% endfor %}
                        </select>
                        <span class="error-message"></span>
                    </div>

                    <!-- Tutor -->
                    <div class="form-group">
                        <label class="form-label" for="tutor_id">Tutor: </label>
                        <select class="form-select select2 tutor_id" name="tutor_id">
                            <option value="" disabled selected>Select Tutor</option>
                            {% for tutor in tutors %}
                            <option value="{{ tutor['tutor_id'] }}">{{ tutor['user']['name'] }} ({{ tutor['user']['email'] }})</option>
                            {% endfor %}
                        </select>
                        <span class="error-message"></span>
                    </div>


                    <!-- Class Type (Normal / Focus) -->
                    <div class="form-group">
                        <label class="form-label" for="class_type">Class Type: </label>
                        <div class="d-flex align-items-center gap-4">
                            <label class="form-radio m-0">
                                <input type="radio" name="class_type" class="class_type" value="N" />
                                <i class="form-icon"></i> Normal
                            </label>
                            <label class="form-radio m-0">
                                <input type="radio" name="class_type" class="class_type" value="F" />
                                <i class="form-icon"></i> Focus
                            </label>
                        </div>
                        <span class="error-message"></span>
                    </div>


                    <!-- Is Open for Schedule Toggle -->
                    <div class="form-group">
                        <label class="form-label" for="is_open_for_schedule">Include in Schedule: </label>
                        <div class="uk-flex uk-flex-middle">
                            <label class="uk-switch">
                                <input type="checkbox" id="is_open_for_schedule" name="is_open_for_schedule" checked>
                                <div class="uk-switch-slider"></div>
                            </label>
                            <label class="uk-margin-small-left">Yes</label>
                        </div>
                    </div>


                    <!-- Buttons -->
                    <div class="text-right" style="padding-top:16px;">
                        <button type="reset" class="btn btn-secondary">Reset</button>
                        <button type="submit" class="btn btn-primary">Add</button>
                    </div>
                </div>
            </div> <!--end left-side -->

            <div class="formformat-right column col-6 col-sm-12 ">
                <div class="card-body my-pagecard-body">
                    <!-- Schedule Mode Toggle -->
                    <div class="form-group">
                        <label class="form-label" for="schedule_mode">Schedule Mode:</label>
                        <div class="uk-flex uk-flex-middle">
                            <label class="uk-margin-small-right">Auto</label>
                            <label class="uk-switch">
                                <input type="checkbox" id="schedule_mode" name="schedule_mode">
                                <div class="uk-switch-slider"></div>
                            </label>
                        </div>
                    </div>


                    <div class="uk-grid">
                        <div class="uk-width-1-3">
                            <!-- Time Per Week -->
                            <div class="form-group">
                                <label class="form-label" for="time_per_week">Time Per Week: </label>
                                <input class="form-input time_per_week" type="number" name="time_per_week" min="0"
                                    max="10" step="1" placeholder="0"
                                    oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                                <span class="error-message"></span>
                            </div>
                        </div>

                        <div class="uk-width-expand" style="padding-left: 20px;">
                            <!-- Duration -->
                            <div class="form-group">
                                <label class="form-label" for="duration">Duration (Minute): </label>
                                <input class="form-input duration" type="number" name="duration" min="0"
                                    max="99999999999" step="1" placeholder="0"
                                    oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                                <span class="error-message"></span>
                            </div>
                        </div>

                        <!-- Container for dynamically generated day/time pairs -->
                        <div id="class_time_pairs_container" class="scrollable-container"></div>

                        <!-- Keep clear button OUTSIDE -->
                        <div id="clear_time_pairs_btn_container"
                            style="text-align: right; margin-top: 10px; display: none;">
                            <button type="button" id="clear_time_pairs_btn" class="btn btn-outline btn-sm"
                                style="background-color: #f8f8f8; border: 1px solid #ccc;">
                                <i class="fa-solid fa-trash-can"></i> Clear All
                            </button>
                        </div>
                    </div>


                    <input type="hidden" name="class_time_pairs_json" id="class_time_pairs_json">
                </div>

            </div>
        </div>
    </div>
</form>
{% endblock %}
