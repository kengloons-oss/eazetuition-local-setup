<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Eaze Tuition</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f7f9fc; }
    .login-box {
      width: 400px;
      margin: 120px auto;
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }
    .btn-login { background: #588ae8; color: white; }
  </style>
</head>
<body>

<div class="login-box">
  <h3 class="text-center mb-4 fw-bold">Admin Login</h3>

  <div class="mb-3">
    <label>Username</label>
    <input id="username" type="text" class="form-control">
  </div>

  <div class="mb-3">
    <label>Password</label>
    <input id="password" type="password" class="form-control">
  </div>

  <button class="btn btn-login w-100" onclick="login()">Login</button>
</div>

<div class="modal fade" id="errorModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header bg-danger text-white">
        <h5 class="modal-title">Notice</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <p id="errorText" class="mb-0"></p>
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">OK</button>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
async function login() {
  const username = document.getElementById("username").value;
  const pass = document.getElementById("password").value;

  try {
    const res = await fetch("/auth/admin/login", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ username: username, password: pass })
    });

    const data = await res.json();

    if (!data.success) {
      showErrorModal(data.error || "Invalid credentials");
      return;
    }

    window.location.href = "/dashboard/";

  } catch (err) {
    showErrorModal("Server error: " + err.message);
  }
}

function showErrorModal(message) {
  document.getElementById("errorText").innerText = message;
  const modal = new bootstrap.Modal(document.getElementById("errorModal"));
  modal.show();
}

document.addEventListener("DOMContentLoaded", () => {
  const params = new URLSearchParams(window.location.search);

  if (params.get("show_modal") === "1") {
    showErrorModal("❌ You must log in as admin to access that page.");
    return;
  }

  fetch("/auth/check-session")
    .then(res => res.json())
    .then(data => {
      if (data.logged_in) {
        showErrorModal("⚠ You are already logged in. Redirecting to dashboard...");
        setTimeout(() => { window.location.href = "/dashboard/"; }, 2000);
      }
    });
});
</script>

</body>
</html>
