<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Announcement - Eaze Tuition</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="card shadow-lg p-4">
        <h3 class="mb-4">Add New Announcement</h3>

        <form id="announcementForm">
            <div class="mb-3">
                <label class="form-label">Title</label>
                <input type="text" class="form-control" id="title" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Content</label>
                <textarea class="form-control" id="content" rows="4" required></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Target Role</label>
                <select class="form-select" id="target_role" required>
                    <option value="">-- Select Role --</option>
                    <option value="student">Student</option>
                    <option value="tutor">Tutor</option>
                    <option value="parent">Parent</option>
                    <option value="all">All</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Expiry Date & Time</label>
                <input type="datetime-local" class="form-control" id="expiry_at" required>
            </div>

            <div class="d-flex justify-content-between">
                <a href="/announcement/list" class="btn btn-secondary">Back</a>
                <button type="submit" class="btn btn-success">Create Announcement</button>
            </div>
        </form>

        <div id="alertBox" class="alert mt-4 d-none"></div>
    </div>
</div>

<script>
document.getElementById("announcementForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const data = {
        title: document.getElementById("title").value,
        content: document.getElementById("content").value,
        target_role: document.getElementById("target_role").value,
        expiry_at: document.getElementById("expiry_at").value.replace("T", " ") + ":00"
    };

    try {
        const response = await fetch("/announcement/create", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data)
        });

        const result = await response.json();
        const alertBox = document.getElementById("alertBox");

        if (response.ok && result.success) {
            alertBox.className = "alert alert-success mt-4";
            alertBox.textContent = "✅ Announcement created successfully!";
            alertBox.classList.remove("d-none");
            document.getElementById("announcementForm").reset();

            
            setTimeout(() => window.location.href = "/announcement/list", 1500);

        } else {
            alertBox.className = "alert alert-danger mt-4";
            alertBox.textContent = "❌ Error: " + (result.error || "Failed to create announcement");
            alertBox.classList.remove("d-none");
        }
    } catch (err) {
        alert("Error connecting to server: " + err.message);
    }
});
</script>
</body>
</html>
