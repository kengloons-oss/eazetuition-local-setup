<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Announcement</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container mt-5">
    <div class="card shadow p-4">
      <h3 class="mb-4">Edit Announcement</h3>

      <form id="editForm">
        <input type="hidden" id="announcement_id">

        <div class="mb-3">
          <label class="form-label">Title</label>
          <input type="text" class="form-control" name="title" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Content</label>
          <textarea class="form-control" name="content" rows="3" required></textarea>
        </div>

        <div class="mb-3">
          <label class="form-label">Target Role</label>
          <select class="form-select" name="target_role" required>
            <option value="parent">Parent</option>
            <option value="student">Student</option>
            <option value="tutor">Tutor</option>
            <option value="all">All</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">Expiry Date & Time</label>
          <input type="datetime-local" class="form-control" name="expiry_at" required>
        </div>

        <div class="d-flex justify-content-between">
          <a href="/announcement/list" class="btn btn-secondary">Cancel</a>
          <button type="submit" class="btn btn-primary">Update</button>
        </div>
      </form>

      <!-- Bootstrap message box -->
      <div id="alertBox" class="alert mt-4 d-none"></div>
    </div>
  </div>

  <script>
    const id = window.location.pathname.split('/').pop();

    async function loadData() {
      const res = await fetch('/announcement/all');
      const data = await res.json();
      const ann = data.announcements.find(a => a.announcement_id == id);

      if (!ann) {
        showAlert("❌ Announcement not found!", "danger");
        setTimeout(() => window.location.href = '/announcement/list', 1500);
        return;
      }

      document.getElementById('announcement_id').value = ann.announcement_id;
      document.querySelector('[name="title"]').value = ann.title;
      document.querySelector('[name="content"]').value = ann.content;
      document.querySelector('[name="target_role"]').value = ann.target_role;

      // "2025-11-09 14:54:00" → "2025-11-09T14:54"
      const expiryFormatted = ann.expiry_at.replace(' ', 'T').slice(0, 16);
      document.querySelector('[name="expiry_at"]').value = expiryFormatted;
    }

    // Show alert like add page
    function showAlert(message, type) {
      const box = document.getElementById("alertBox");
      box.className = `alert alert-${type} mt-4`;
      box.textContent = message;
      box.classList.remove("d-none");
    }

    document.getElementById('editForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const id = document.getElementById('announcement_id').value;
      const formData = new FormData(e.target);
      const data = Object.fromEntries(formData.entries());

      if (data.expiry_at.includes('T')) {
        data.expiry_at = data.expiry_at.replace('T', ' ') + ':00';
      }

      const res = await fetch(`/announcement/edit/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });

      const result = await res.json();

      if (res.ok) {
        showAlert("✅ Announcement edited successfully!", "success");
        setTimeout(() => window.location.href = '/announcement/list', 1500);
      } else {
        showAlert("❌ " + (result.error || "Failed to update announcement"), "danger");
      }
    });

    document.addEventListener('DOMContentLoaded', loadData);
  </script>

</body>
</html>
