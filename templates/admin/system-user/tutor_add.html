<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Tutor - Eaze Tuition</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
  <div class="card shadow-lg p-4">
    <h3 class="mb-4">Add New Tutor</h3>

    <form id="tutorForm">
      <div class="mb-3">
        <label class="form-label">Full Name</label>
        <input type="text" class="form-control" id="name" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" id="email" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" id="password" required>
      </div>

      <div class="mb-3">
        <label class="form-label">IC No</label>
        <input type="text" class="form-control" id="ic_no">
      </div>

      <div class="mb-3">
        <label class="form-label">Gender</label>
        <select class="form-select" id="gender">
          <option value="">-- Select Gender --</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label">Date of Birth</label>
        <input type="date" class="form-control" id="dob">
      </div>

      <div class="mb-3">
        <label class="form-label">Address</label>
        <textarea class="form-control" id="address" rows="2"></textarea>
      </div>

      <div class="mb-3">
        <label class="form-label">Telephone No</label>
        <input type="text" class="form-control" id="tel_no" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Age</label>
        <input type="number" class="form-control" id="age" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Position</label>
        <input type="text" class="form-control" id="position" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Salary</label>
        <input type="number" step="0.01" class="form-control" id="salary" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Status</label>
        <select class="form-select" id="status">
          <option value="1">Active</option>
          <option value="0">Inactive</option>
        </select>
      </div>

      <div class="d-flex justify-content-between">
        <a href="/users/tutors/list" class="btn btn-secondary">Back</a>
        <button type="submit" class="btn btn-success">Create Tutor</button>
      </div>
    </form>

    <div id="alertBox" class="alert mt-4 d-none"></div>
  </div>
</div>

<script>
document.getElementById("tutorForm").addEventListener("submit", async function(event) {
  event.preventDefault();

  const data = {
    name: document.getElementById("name").value,
    email: document.getElementById("email").value,
    password: document.getElementById("password").value,
    ic_no: document.getElementById("ic_no").value,
    gender: document.getElementById("gender").value,
    dob: document.getElementById("dob").value,
    address: document.getElementById("address").value,
    tel_no: document.getElementById("tel_no").value,
    age: document.getElementById("age").value,
    position: document.getElementById("position").value,
    salary: document.getElementById("salary").value,
    status: document.getElementById("status").value,
    type: "tutor"
  };

  try {
    const response = await fetch("/users/tutors/add", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data)
    });

    const result = await response.json();
    const alertBox = document.getElementById("alertBox");

    if (response.ok && result.success) {
      alertBox.className = "alert alert-success mt-4";
      alertBox.textContent = "✅ Tutor created successfully!";
      alertBox.classList.remove("d-none");
      document.getElementById("tutorForm").reset();

      setTimeout(() => {
        window.location.href = "/users/tutors/list";
      }, 1500);

    } else {
      alertBox.className = "alert alert-danger mt-4";
      alertBox.textContent = "❌ Error: " + (result.error || "Failed to create tutor");
      alertBox.classList.remove("d-none");
    }
  } catch (err) {
    alert("Error connecting to server: " + err);
  }
});
</script>

</body>
</html>
