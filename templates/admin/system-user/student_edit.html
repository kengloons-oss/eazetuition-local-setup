<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Student - Eaze Tuition</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
  <div class="card shadow-lg p-4">
    <h3 class="mb-4">Edit Student</h3>

    <form id="studentForm">
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" id="email" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" id="password" placeholder="Enter new password">
      </div>

      <div class="mb-3">
        <label class="form-label">Student Level</label>
        <select id="edu_lvl_id" class="form-select" required>
          <option value="">-- Select Level --</option>
        </select>
      </div>

      <div class="d-flex justify-content-between">
        <a href="/users/students/list" class="btn btn-secondary">Back</a>
        <button type="submit" class="btn btn-primary">Update Student</button>
      </div>
    </form>

    <div id="alertBox" class="alert mt-4 d-none"></div>
  </div>
</div>

<script>
const pathParts = window.location.pathname.split('/');
const user_id = pathParts[pathParts.length - 1];

async function loadLevels(selectedId) {
  try {
    const res = await fetch("/users/education-levels/active");
    const data = await res.json();
    const select = document.getElementById("edu_lvl_id");
    select.innerHTML = `<option value="">-- Select Level --</option>`; 

    data.levels.forEach(lvl => {
      const option = document.createElement("option");
      option.value = lvl.edu_lvl_id;
      option.textContent = lvl.name;
      if (String(lvl.edu_lvl_id) === String(selectedId)) option.selected = true;
      select.appendChild(option);
    });
  } catch (err) {
    console.error("Error loading levels:", err);
    alert("Failed to load education levels");
  }
}

async function loadStudent() {
  try {
    const res = await fetch(`/users/students/${user_id}`);
    if (!res.ok) throw new Error("Failed to load student");
    const data = await res.json();
    const s = data.student;

    document.getElementById("email").value = s.email || "";
    await loadLevels(s.edu_lvl_id);
  } catch (err) {
    alert("Error loading student: " + err.message);
  }
}

document.getElementById("studentForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const payload = {
    email: document.getElementById("email").value,
    password: document.getElementById("password").value,
    edu_lvl_id: document.getElementById("edu_lvl_id").value
  };

  try {
    const res = await fetch(`/users/students/edit/${user_id}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    const result = await res.json();
    const alertBox = document.getElementById("alertBox");

    if (res.ok && result.success) {
      alertBox.className = "alert alert-success mt-4";
      alertBox.textContent = "✅ Student updated successfully!";
      alertBox.classList.remove("d-none");

      setTimeout(() => {
        window.location.href = "/users/students/list";
      }, 1500);

    } else {
      alertBox.className = "alert alert-danger mt-4";
      alertBox.textContent = "❌ Error: " + (result.error || "Failed to update student");
      alertBox.classList.remove("d-none");
    }
  } catch (err) {
    alert("Error connecting to server: " + err.message);
  }
});

document.addEventListener("DOMContentLoaded", loadStudent);
</script>

</body>
</html>
