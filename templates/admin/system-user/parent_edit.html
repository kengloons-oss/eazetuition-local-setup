<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Parent - Eaze Tuition</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
  <div class="card shadow-lg p-4">
    <h3 class="mb-4">Edit Parent</h3>

    <form id="parentForm">
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" id="email" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" id="password" placeholder="Enter new password">
      </div>

      <div class="d-flex justify-content-between">
        <a href="/users/parents/list" class="btn btn-secondary btn-back">Back</a>
        <button type="submit" class="btn btn-primary">Update Parent</button>
      </div>
    </form>

    <div id="alertBox" class="alert mt-4 d-none"></div>
  </div>
</div>

<script>
const pathParts = window.location.pathname.split('/');
const user_id = pathParts[pathParts.length - 1];

// Load parent details
async function loadParent() {
  try {
    const res = await fetch(`/users/parents/${user_id}`);
    const text = await res.text(); 

    let data;
    try {
      data = JSON.parse(text); 
    } catch (e) {
      console.error("Expected JSON but got HTML:", text);
      alert("Error: Unexpected response from server.");
      return;
    }

    if (!data.success) {
      alert("Error loading parent: " + (data.error || "Unknown error"));
      return;
    }

    document.getElementById("email").value = data.parent.email;

  } catch (err) {
    alert("Error connecting to server: " + err.message);
  }
}


document.getElementById("parentForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const data = {
    email: document.getElementById("email").value,
    password: document.getElementById("password").value
  };

  try {
    const res = await fetch(`/users/parents/edit/${user_id}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data)
    });

    const text = await res.text(); 
    let result;
    try {
      result = JSON.parse(text);
    } catch (e) {
      console.error("Expected JSON but got HTML:", text);
      alert("Error: Unexpected response from server.");
      return;
    }

    const alertBox = document.getElementById("alertBox");
    if (res.ok && result.success) {
      alertBox.className = "alert alert-success mt-4";
      alertBox.textContent = "✅ Parent updated successfully!";
      alertBox.classList.remove("d-none");

      setTimeout(() => {
        window.location.href = "/users/parents/list";
      }, 1500);

    } else {
      alertBox.className = "alert alert-danger mt-4";
      alertBox.textContent = "❌ Error: " + (result.error || "Failed to update parent");
      alertBox.classList.remove("d-none");
    }

  } catch (err) {
    alert("Error connecting to server: " + err.message);
  }
});

document.addEventListener("DOMContentLoaded", loadParent);
</script>

</body>
</html>
