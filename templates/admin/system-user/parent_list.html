{% extends "_admin_base.html" %}

{% block head %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
{% endblock %}

{% block content %}
<h2 class="fw-bold mb-3">Parent List</h2>

<form id="filterForm">
    <div class="container-filter">
        <div class="half">
            <div class="card card-blue-shadow">
                <div class="card-txtfield card-body">
                    <label for="search">Search Name/Email/IC:</label>
                    <input type="text" id="search" name="search" class="form-control" placeholder="Search...">

                    <label for="status" class="mt-2">Status:</label>
                    <select name="status" id="status" class="form-select select2">
                        <option value="">All</option>
                        <option value="1">Active</option>
                        <option value="0">Inactive</option>
                    </select>

                    <label for="per_page" class="mt-2">Items per page:</label>
                    <select name="per_page" id="per_page" class="form-select select2">
                        <option value="5">5</option>
                        <option value="10">10</option>
                        <option value="20">20</option>
                    </select>
                </div>
            </div>
        </div>
    </div>
</form>

<div class="mt-3 table-responsive">
    <table class="table table-bordered text-center">
        <thead>
            <tr>
                <th>#</th>
                <th>Name</th>
                <th>Email</th>
                <th>Tel No</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="parentTableBody"></tbody>
    </table>
</div>

<nav>
    <ul class="pagination justify-content-center" id="pagination"></ul>
</nav>
{% endblock %}

{% block scripts %}
<script>
let currentPage = 1;

function loadParents(params = {}) {
    const formData = $('#filterForm').serializeArray();
    formData.forEach(item => params[item.name] = item.value);

    params.page = currentPage;
    params.per_page = $('#per_page').val() || 5;

    $.get("/users/parents", params, function(data) {
        const tbody = $('#parentTableBody');
        tbody.empty();

        if (!data.parents || data.parents.length === 0) {
            tbody.append('<tr><td colspan="6">No parents found.</td></tr>');
            $('#pagination').empty();
            return;
        }

        data.parents.forEach((p, index) => {
            tbody.append(`
                <tr>
                    <td>${index + 1 + (currentPage-1)*params.per_page}</td>
                    <td>${p.name}</td>
                    <td>${p.email}</td>
                    <td>${p.tel_no || '-'}</td>
                    <td>${p.status == '1' ? 'Active' : 'Inactive'}</td>
                    <td>
                        <a href="/users/parents/edit/${p.user_id}" class="btn btn-sm btn-warning me-1">✏️ Edit</a>
                        <button class="btn btn-sm btn-primary" onclick="toggleStatus(${p.user_id}, '${p.status}')">🔁 Toggle</button>
                    </td>
                </tr>
            `);
        });

        renderPagination(data.page, data.pages);
    });
}

function renderPagination(current, totalPages) {
    const pagination = $('#pagination');
    pagination.empty();
    for (let i = 1; i <= totalPages; i++) {
        const active = i === current ? 'active' : '';
        pagination.append(`<li class="page-item ${active}">
            <a class="page-link" href="#" onclick="gotoPage(${i})">${i}</a>
        </li>`);
    }
}

function gotoPage(page) {
    currentPage = page;
    loadParents();
}

function toggleStatus(userId, currentStatus) {
    const newStatus = currentStatus === '1' ? '0' : '1';
    if (!confirm(`Are you sure you want to ${newStatus === '1' ? 'activate' : 'deactivate'} this user?`)) return;

    $.ajax({
        url: `/users/update-status/${userId}`,
        type: 'PUT',
        contentType: 'application/json',
        data: JSON.stringify({ status: newStatus }),
        success: function(res) {
            alert(res.message || 'Status updated');
            loadParents();
        }
    });
}

$(document).ready(function() {
    loadParents();
    $('#search, #status, #per_page').on('input change', function() {
        currentPage = 1;
        loadParents();
    });
});
</script>
{% endblock %}
