{% extends "_admin_base.html" %}

{% block head %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<style>
    .btn-create { background: #588ae8; color: white; }
    .container-filter { margin-bottom: 1rem; }
</style>
{% endblock %}

{% block content %}
<h2 class="fw-bold mb-3">Tutor List</h2>

<!-- Top bar: Search + Add button -->
<div class="d-flex justify-content-between align-items-center mb-3">
    <input type="text" id="searchBox" name="search" class="form-control w-25" placeholder="Search Name/Email/IC">
    <a href="/users/tutors/add" class="btn btn-create">➕ Create Tutor</a>
</div>

<!-- Filter card -->
<form id="filterForm">
    <div class="container-filter">
        <div class="half">
            <div class="card card-blue-shadow">
                <div class="card-txtfield card-body">
                    <label for="status" class="mt-2">Status:</label>
                    <select name="status" id="status" class="form-select select2">
                        <option value="">All</option>
                        <option value="1">Active</option>
                        <option value="0">Inactive</option>
                    </select>

                    <label for="per_page" class="mt-2">Items per page:</label>
                    <select name="per_page" id="per_page" class="form-select select2">
                        <option value="5">5</option>
                        <option value="10">10</option>
                        <option value="20">20</option>
                    </select>
                </div>
            </div>
        </div>
    </div>
</form>

<!-- Table -->
<div class="mt-3 table-responsive">
    <table class="table table-bordered text-center">
        <thead>
            <tr>
                <th>#</th>
                <th>Name</th>
                <th>Email</th>
                <th>Tel No</th>
                <th>Position</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="tutorTableBody"></tbody>
    </table>
</div>

<!-- Pagination -->
<nav>
    <ul class="pagination justify-content-center" id="pagination"></ul>
</nav>

<!-- Status Modal -->
<div class="modal fade" id="statusModal" tabindex="-1" aria-labelledby="statusModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="statusModalLabel">Confirm Status Change</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body" id="statusModalBody">
        Are you sure you want to change the status?
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" id="confirmStatusChange">Yes, Change</button>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let currentPage = 1;

function loadTutors(params = {}) {
    const formData = $('#filterForm').serializeArray();
    formData.forEach(item => params[item.name] = item.value);

    params.page = currentPage;
    params.per_page = $('#per_page').val() || 5;
    params.search = $('#searchBox').val() || "";

    $.get("/users/tutors", params, function(data) {
        const tbody = $('#tutorTableBody');
        tbody.empty();

        if (!data.tutors || data.tutors.length === 0) {
            tbody.append('<tr><td colspan="7">No tutors found.</td></tr>');
            $('#pagination').empty();
            return;
        }

        data.tutors.forEach((t, index) => {
            tbody.append(`
                <tr>
                    <td>${index + 1 + (currentPage-1)*params.per_page}</td>
                    <td>${t.name}</td>
                    <td>${t.email}</td>
                    <td>${t.tel_no || '-'}</td>
                    <td>${t.position || '-'}</td>
                    <td>${t.status == '1' ? 'Active' : 'Inactive'}</td>
                    <td>
                        <a href="/users/tutors/edit/${t.user_id}" class="btn btn-sm btn-warning me-1">✏️ Edit</a>
                        <button class="btn btn-sm btn-primary" onclick="toggleStatus(${t.user_id}, '${t.status}')">🔁 Toggle</button>
                    </td>
                </tr>
            `);
        });

        renderPagination(data.page, data.pages);
    });
}

function renderPagination(current, totalPages) {
    const pagination = $('#pagination');
    pagination.empty();
    for (let i = 1; i <= totalPages; i++) {
        const active = i === current ? 'active' : '';
        pagination.append(`<li class="page-item ${active}">
            <a class="page-link" href="#" onclick="gotoPage(${i})">${i}</a>
        </li>`);
    }
}

function gotoPage(page) {
    currentPage = page;
    loadTutors();
}

function toggleStatus(userId, currentStatus) {
    const newStatus = currentStatus === '1' ? '0' : '1';
    if (!confirm(`Are you sure you want to ${newStatus === '1' ? 'activate' : 'deactivate'} this user?`)) return;

    $.ajax({
        url: `/users/update-status/${userId}`,
        type: 'PUT',
        contentType: 'application/json',
        data: JSON.stringify({ status: newStatus }),
        success: function(res) {
            alert(res.message || 'Status updated');
            loadTutors();
        }
    });
}

$(document).ready(function() {
    loadTutors();
    $('#searchBox, #status, #per_page').on('input change', function() {
        currentPage = 1;
        loadTutors();
    });
});
</script>
{% endblock %}
